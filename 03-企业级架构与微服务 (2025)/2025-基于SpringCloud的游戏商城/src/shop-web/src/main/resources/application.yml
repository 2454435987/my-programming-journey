server:
  port: 8008
spring:
  application:
    name: shop-web
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    cache: false
  main:
    allow-bean-definition-overriding: true

# 自定义分页默认配置
user:
  list:
    default-name: ""
    default-uid: 0
    default-page: 1
    default-limit: 10
cart:
  list:
    default-pname: ""
    default-page: 1
    default-limit: 5
