

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>忘记密码 - layuiAdmin</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="stylesheet" th:href="@{/layuiadmin/layui/css/layui.css}" href="../../layuiadmin/layui/css/layui.css" media="all">
  <link rel="stylesheet" th:href="@{/layuiadmin/style/admin.css}" href="../../layuiadmin/style/admin.css" media="all">
  <link rel="stylesheet" th:href="@{/layuiadmin/style/login.css}" href="../../layuiadmin/style/login.css" media="all">
</head>

  <div class="layadmin-user-login layadmin-user-display-show" id="LAY-user-login" style="display: none;">
    <div class="layadmin-user-login-main">
      <div class="layadmin-user-login-box layadmin-user-login-header">
        <h2>聚宝阁</h2>
        <p>聚窟洲英雄专属的极品神兵与外观交易平台</p>
      </div>
      <div class="layadmin-user-login-box layadmin-user-login-body layui-form">
      
        <script type="text/html" template>
          {{# if(layui.router().search.type === 'resetpass'){ }}
            <div class="layui-form-item">
              <label class="layadmin-user-login-icon layui-icon layui-icon-password" for="LAY-user-login-password"></label>
              <input type="password" name="password" id="LAY-user-login-password" lay-verify="pass" placeholder="新密码" class="layui-input">
            </div>
            <div class="layui-form-item">
              <label class="layadmin-user-login-icon layui-icon layui-icon-password" for="LAY-user-login-repass"></label>
              <input type="password" name="repass" id="LAY-user-login-repass" lay-verify="required" placeholder="确认密码" class="layui-input">
            </div>
            <div class="layui-form-item">
              <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="LAY-user-forget-resetpass">重置新密码</button>
            </div>
          {{# } else { }}
            <div class="layui-form-item">
              <label class="layadmin-user-login-icon layui-icon layui-icon-cellphone" for="LAY-user-login-cellphone"></label>
              <input type="text" name="cellphone" id="LAY-user-login-cellphone" lay-verify="phone" placeholder="请输入注册时的手机号" class="layui-input">
            </div>
            <div class="layui-form-item">
              <div class="layui-row">
                <div class="layui-col-xs7">
                  <label class="layadmin-user-login-icon layui-icon layui-icon-vercode" for="LAY-user-login-vercode"></label>
                  <input type="text" name="vercode" id="LAY-user-login-vercode" lay-verify="required" placeholder="图形验证码" class="layui-input">
                </div>
                <div class="layui-col-xs5">
                  <div style="margin-left: 10px;">
                    <img src="/user/captcha" class="layadmin-user-login-codeimg" id="LAY-user-get-vercode">
                  </div>
                </div>
              </div>
            </div>
            <div class="layui-form-item">
              <div class="layui-row">
                <div class="layui-col-xs7">
                  <label class="layadmin-user-login-icon layui-icon layui-icon-vercode" for="LAY-user-login-smscode"></label>
                  <input type="text" name="vercode" id="LAY-user-login-smscode" lay-verify="required" placeholder="短信验证码" class="layui-input">
                </div>
                <div class="layui-col-xs5">
                  <div style="margin-left: 10px;">
                    <button type="button" class="layui-btn layui-btn-primary layui-btn-fluid" id="LAY-user-getsmscode">获取验证码</button>
                  </div>
                </div>
              </div>
            </div>
            <div class="layui-form-item">
              <button class="layui-btn layui-btn-fluid" lay-submit lay-filter="LAY-user-forget-submit">找回密码</button>
            </div>
          {{# } }}
        </script>
   
      </div>
    </div>
    
    <div class="layui-trans layadmin-user-login-footer">
      <p>© 2026 <a href="javascript:;" target="_blank">聚宝阁 版权所有</a></p>
      <p>
        <span><a href="javascript:;" target="_blank">加入聚窟洲</a></span>
        <span><a href="javascript:;" target="_blank">幻丝规则</a></span>
        <span><a href="javascript:;" target="_blank">联系掌柜</a></span>
      </p>
    </div>

  </div>

  <script th:src="@{/layuiadmin/layui/layui.js}" src="../../layuiadmin/layui/layui.js"></script>
  <script>
  layui.config({
    base: '../../layuiadmin/' //静态资源所在路径
  }).extend({
    index: 'lib/index' //主入口模块
  }).use(['index', 'user'], function(){
    var $ = layui.$
    ,setter = layui.setter
    ,admin = layui.admin
    ,form = layui.form
    ,router = layui.router();

    form.render();
    // 点击图形验证码图片，重新获取验证码
    // 注意：URL 后面必须拼上时间戳 '?t=' + new Date().getTime()，否则浏览器有缓存，图片不会刷新！
    $('body').on('click', '#LAY-user-get-vercode', function(){
      this.src = '/user/captcha?t=' + new Date().getTime();
    });

    // 【第二步：获取短信验证码按钮逻辑】
    $('body').on('click', '#LAY-user-getsmscode', function(){
      var cellphone = $('#LAY-user-login-cellphone').val();
      var graphicCode = $('#LAY-user-login-vercode').val();

      // 简单的前端格式校验
      if(!/^1\d{10}$/.test(cellphone)){
        return layer.msg('请输入正确的11位手机号', {icon: 5});
      }
      if(!graphicCode){
        return layer.msg('请先填写旁边的图形验证码', {icon: 5});
      }

      // 获取按钮本身并禁用它，防止用户疯狂点击
      var btn = $(this);
      btn.addClass('layui-btn-disabled').prop('disabled', true);

      // 发起 Ajax 请求调用我们刚刚写的后端接口
      $.ajax({
        url: '/user/sendSms',
        type: 'post',
        data: {
          cellphone: cellphone,
          graphicCode: graphicCode
        },
        success: function(res){
          if(res.code === 0){ // 假设后端 0 是成功
            layer.msg('短信已发送，请注意查收！', {icon: 1});

            // 搞一个 60 秒倒计时特效！
            var count = 60;
            var timer = setInterval(function(){
              count--;
              btn.text(count + ' 秒后重发');
              if(count <= 0){
                clearInterval(timer);
                btn.removeClass('layui-btn-disabled').prop('disabled', false).text('获取验证码');
              }
            }, 1000);

          } else {
            // 图形验证码写错等情况被拦截
            layer.msg(res.msg || '发送失败', {icon: 2});
            // 恢复按钮状态
            btn.removeClass('layui-btn-disabled').prop('disabled', false).text('获取验证码');
            // 顺便自动模拟点击一下图片，换一张新的图形验证码
            $('#LAY-user-get-vercode').click();
          }
        }
      });
    });
    //找回密码下一步
    form.on('submit(LAY-user-forget-submit)', function(obj){
      var field = obj.field;
      //请求接口
      $.ajax({
        url: '/user/verifySmsCode'
        ,type: 'post'
        ,data: field
        ,success: function(res){   
          if(res.code === 0){ // 假设后端 0 表示成功 R.right()
              layer.msg('身份验证成功！', {time: 1000}, function() {
                  // Layui路由黑科技：自动切换到输入新密码的界面
                  location.hash = '/type=resetpass';
                  location.reload();
              });
          } else {
              layer.msg(res.msg || '验证码错误', {icon: 5}); // 提示验证码错误
          }     
        }
      });
      return false;
    });
    
    //重置密码
    form.on('submit(LAY-user-forget-resetpass)', function(obj){
      var field = obj.field;
      
      //确认密码
      if(field.password !== field.repass){
        return layer.msg('两次密码输入不一致', {icon: 5});
      }

      //请求接口，把新密码传给后端
      $.ajax({
        url: '/user/resetPassword' 
        ,type: 'post'
        ,data: {
             password: field.password
        }
        ,success: function(res){   
          if(res.code === 0){
              layer.msg('密码已成功重置，快去登录吧！', {
                offset: '15px'
                ,icon: 1
                ,time: 2000
              }, function(){
                top.location.href = '/user/toUserLogin'; //强制跳出iframe，整个窗口跳转到登录界面
              });
          } else {
              layer.msg(res.msg || '重置失败', {icon: 5});
          }
        }
      });
      return false;
    });
    
  });
  </script>
</body>
</html>
