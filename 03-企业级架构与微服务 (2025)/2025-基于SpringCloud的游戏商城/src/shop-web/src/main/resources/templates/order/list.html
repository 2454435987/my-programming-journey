<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <title>订单列表查询</title>
  <meta name="renderer" content="webkit">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="stylesheet" th:href="@{/layuiadmin/layui/css/layui.css}" href="/static/layuiadmin/layui/css/layui.css" media="all">
  <link rel="stylesheet" th:href="@{/layuiadmin/style/admin.css}" href="/static/layuiadmin/style/admin.css" media="all">
  <style>
    .layui-table-cell .layui-form-checkbox[lay-skin="primary"] {
      top: 50%;
      transform: translateY(-50%);
    }
  </style>
</head>

<body>
<div class="layui-fluid">
  <div class="layui-card">

    <div class="layui-card-body layui-form">
      <!--        异步方式生成表格体-->
      <table id="LAY-app-content-list" lay-filter="LAY-app-content-list" class="layui-hide">
      </table>

      <!--工具栏-->
      <script type="text/html" id="toolbarDemo">
        <div class="layui-btn-container">
          <button class="layui-btn layuiadmin-btn-list layui-btn-danger"
                  lay-event="batchdel">批量删除</button>
        </div>
      </script>

      <!--表格右侧的操作列-->
      <script type="text/html" id="table-content-list">
        <!-- 卖家专属按钮：只有我是这个商品的卖家(merchantId)，且已支付、未发货时，显示发货 -->
        {{#  if(d.merchantId == currentUserUid && d.status == '已支付' && d.goodsStatus == '未发货'){ }}
        <a class="layui-btn layui-btn-warm layui-btn-xs" lay-event="ship"><i class="layui-icon layui-icon-release"></i>发货</a>
        {{#  } }}

        <!-- 买家专属按钮：只有我是这个订单的买家(uid)，且卖家已发货时，显示确认收货 -->
        {{#  if(d.uid == currentUserUid && d.goodsStatus == '已发货'){ }}
        <a class="layui-btn layui-btn-normal layui-btn-xs" lay-event="receive"><i class="layui-icon layui-icon-ok"></i>确认收货</a>
        {{#  } }}

        <!-- 评价按钮：买家在已完成的状态下可以点击跳转去评价 -->
        {{#  if(d.uid == currentUserUid && d.goodsStatus == '已收货'){ }}
        <a class="layui-btn layui-btn-xs" lay-event="evaluate"><i class="layui-icon layui-icon-edit"></i>去评价</a>
        {{#  } }}

        <a class="layui-btn layui-btn-danger layui-btn-xs" lay-event="del"><i class="layui-icon layui-icon-delete"></i>删除</a>
      </script>

    </div>
  </div>
</div>

<script th:src="@{/layuiadmin/layui/layui.js}" src="/static/layuiadmin/layui/layui.js"></script>
<script th:inline="javascript">
  var currentUserUid = [[${session.user1 != null ? session.user1.uid : 0}]];
</script>
<script type="text/javascript">
  layui.config({
    base: '/layuiadmin/' //静态资源所在路径
  }).extend({
    index: 'lib/index' //主入口模块
  }).use(['index', 'table'], function(){
    var table = layui.table
            ,form = layui.form
            ,layer = layui.layer
            ,laypage = layui.laypage
            ,$ = layui.jquery;

    layer.ready(function (){
      tableRender(table);
    });

    //监听行外左侧工具条按钮
    table.on('toolbar(LAY-app-content-list)', function(obj){
      if(obj.event == 'batchdel') {
        // 获取选中了复选框的记录
        var checkStatus = table.checkStatus('LAY-app-content-list'), data = checkStatus.data;
        var delList=[];
        data.forEach(function(n,i){
          delList.push(n.oid);
        });

        console.log(delList);
        layer.confirm('确认要删除被选中的记录吗？', {
          btn : [ '确定', '取消' ]//按钮
        }, function(index) {
          //提交 Ajax 成功后，关闭当前弹层并重载表格
          $.ajax({
            type: 'post',
            url: '/order/batchDelOrder',// ajax请求路径
              data: {
                oids: delList
              },
            success: function(data){
              console.log(data);
              if(data.code == '0'){

                tableRender(layui.table);
                layer.msg('批量删除成功', {
                  time: 1000,
                });
              }else {
                layer.msg('批量删除失败', {
                  time: 1000,
                });
              }
            }
          });
        });
      }
    });

    //监听行内操作列按钮
    table.on('tool(LAY-app-content-list)', function(obj){
      if(obj.event == 'ship') {
        console.log("ship for:" + obj.data.oid);
          layer.confirm('确认要发货吗？', {
              btn : [ '确定', '取消' ]//按钮
          }, function(index) {
              $.ajax({
                  type: 'post',
                  url: '/order/editOrder/' + obj.data.oid, // ajax请求路径
                  data: {},
                  success: function(data){
                      console.log(data);
                      if(data.code == '0'){
                          tableRender(layui.table);
                          layer.msg('发货成功', {time: 1000});
                      }else {
                          layer.msg('发货失败', {time: 1000});
                      }
                  }
              });
          });
      } else if(obj.event == 'receive') {
        console.log("receive for:" + obj.data.oid);
          layer.confirm('确认收到商品了吗？', {
              btn : [ '确定', '取消' ]//按钮
          }, function(index) {
              $.ajax({
                  type: 'post',
                  url: '/order/receiveOrder/' + obj.data.oid, // ajax请求路径
                  data: {},
                  success: function(data){
                      console.log(data);
                      if(data.code == '0'){
                          tableRender(layui.table);
                          layer.msg('收货成功，订单已完成', {time: 1000});
                      }else {
                          layer.msg('操作失败', {time: 1000});
                      }
                  }
              });
          });
      } else if(obj.event == 'evaluate') {
          // 如果点击去评价，带着 pid 跳回商品详情页
          if(obj.data.pid) {
              window.location.href = '/prod/getProdById/' + obj.data.pid;
          } else {
              layer.msg('该订单没有商品记录，无法评价', {time: 1000});
          }
      } else if(obj.event == 'del') {
        console.log("del for:" + obj.data.oid);
        layer.confirm('确认要删除吗？', {
          btn : [ '确定', '取消' ]//按钮
        }, function(index) {
          //提交 Ajax 成功后，关闭当前弹层并重载表格
          $.ajax({
            type: 'post',
            url: '/order/deleteOrderByOid/' + obj.data.oid, // ajax请求路径
            data: {},
            success: function(data){
              console.log(data);
              if(data.code == '0'){

                tableRender(layui.table);
                layer.msg('删除成功', {
                  time: 1000,
                });
              }else {
                layer.msg('删除失败', {
                  time: 1000,
                });
              }
            }
          });
        });
      }
    });
  });

  function tableRender(table) {
      table.render({
      elem: '#LAY-app-content-list'  // 指定渲染的table的id属性
      ,url: '/order/orderList'  // 渲染的数据来源
      ,page: true  // 开启自带分页
      ,limits: [2,5,10,20,50]  //每页条数的选择项，默认：[10,20,30,40,50,60,70,80,90]。
      ,limit: 5 //每页默认显示的数量
      ,layout: ['count', 'prev', 'page', 'next', 'limit', 'refresh', 'skip'] // 分页栏的顺序
      ,method: 'post'  //提交方式
      ,request: {pageName: 'page', limitName: 'limit'}  // 要对应请求处理方法中的参数名称
      ,toolbar: '#toolbarDemo' //开启头部工具栏，并为其绑定左侧模板
      ,cellMinWidth: 80
      ,defaultToolbar: ['filter', 'exports', 'print', { //自定义头部工具栏右侧图标。如无需自定义，去除该参数即可
        title: '提示'
        ,layEvent: 'LAYTABLE_TIPS'
        ,icon: 'layui-icon-tips'
      }]
      ,title: '用户信息表'
      ,cols: [ [ {type:'checkbox'}
        ,{field:'oid', title:'订单编号', width:100, sort:'true'}  // 每一列，field，json对象中的属性名称
        ,{
           title:'买家姓名',
           width:100,
          templet:function (d) {
              return d.user ? d.user.name : '未知买家';
          }
         }
        ,{
           title:'卖家姓名',
           width:100,
          templet:function (d) {
              return d.merchant ? d.merchant.name : '未知卖家';
          }
         }
        ,{
           title:'商品名称',
           width:120,
          templet:function (d) {
              return d.product ? d.product.pname : '-';
          }
         }
        ,{
           title:'商品图片',
           width:100,
          templet:function (d) {
              return d.product && d.product.pfile ? '<img src="' + d.product.pfile + '" style="height:30px;">' : '-';
          }
         }
        ,{field:'quantity', title:'数量', width:80}
        ,{field:'totalPrice', title:'总金额', width:100}
        ,{field:'createtime', title:'创建时间', width:180}
        ,{field:'status', title:'付款状态', width:100}
        ,{field:'goodsStatus', title:'发货状态', width:100}
        ,{fixed: 'right', title:'操作', toolbar: '#table-content-list', width:200}
      ] ]
    });
  }
</script>
</body>
</html>
