<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>支付成功</title>
    <link th:href="@{/css/layout.css}" rel="stylesheet" type="text/css"/>
    <link th:href="@{/css/jquery-ui-1.10.4.custom.min.css}" rel="stylesheet" type="text/css"/>
    <script type="text/javascript" th:src="@{/js/jquery-1.3.2.min.js}"></script>
    <script type="text/javascript" th:src="@{/js/jquery-ui-1.10.4.custom.min.js}"></script>
</head>
<body>

<!--主体内容第一部分开始-->
<div class="dingdan">
    <!-- 步骤进度条 -->
    <div class="dingdan-m">
        <ul>
            <!-- 全部变成灰色或完成状态的图 (11, 22, 33) -->
            <li><img src="/images/n11.jpg" width="205" height="62"/></li>
            <li><img src="/images/jt21.jpg" width="44" height="60"/></li>
            <li><img src="/images/n22.jpg" width="205" height="62"/></li>
            <li><img src="/images/jt21.jpg" width="44" height="60"/></li>
            <li><img src="/images/n33.jpg" width="205" height="62"/></li>
        </ul>
    </div>
    
    <div class="dingdan-inf" style="padding-bottom: 60px;">
        <!-- 成功提示区域 -->
        <div class="dingdan-infm" style="text-align: center; padding: 50px 0 20px 0; color: #6aa71b; font-size: 28px; font-weight: bold; border-bottom: none;">
            🎉 恭喜您，支付成功！
        </div>
        
        <div class="vistor_info" style="text-align: center; margin-bottom: 40px;"> 
            <p style="font-size: 16px; color: #666; line-height: 35px;">您的订单（<span style="color:#f60; font-weight:bold;" th:text="${session.order != null ? session.order.oid : '已提交'}"></span>）已经飞速推送到商家处理中心。</p>
            <p style="font-size: 16px; color: #666; line-height: 35px;">感谢您的支持，我们将尽快为您发货！</p>
        </div>

        <!-- 底部跳转按钮区域 -->
        <div class="xyb" style="text-align: center; float: none; height: auto;">
            <!-- 跳转到个人主页 -->
            <a th:href="@{/toUserIndex}" style="display: inline-block; padding: 12px 35px; background-color: #6aa71b; color: white; text-decoration: none; border-radius: 3px; font-size: 16px; margin-right: 30px; font-weight: bold;">进入个人主页</a>
            <a th:href="@{/prod/index.html}" style="display: inline-block; padding: 12px 35px; background-color: #f1f1f1; color: #333; text-decoration: none; border-radius: 3px; font-size: 16px; border: 1px solid #ddd;">返回商城首页</a>
        </div>
    </div>
</div>

</body>
</html>
