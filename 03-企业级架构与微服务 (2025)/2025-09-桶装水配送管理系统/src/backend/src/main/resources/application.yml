server:
  port: 8088
  servlet:
    context-path: /

spring:
  application:
    name: water-delivery-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/water_delivery_db?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

# JWT 配置
jwt:
  secret: waterdeliverysecretkey2026waterdeliverysupersecurekey
  expiration: 604800000 # 7天 (毫秒)
  header: Authorization
  prefix: "Bearer "

# AI 多模态配置 (免训练API)
ai:
  vision:
    api-key: "sk-mock-or-dashscope-key"
    base-url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    model: "qwen-vl-plus"

# Knife4j API 文档
knife4j:
  enable: true
  openapi:
    title: 桶装水配送管理系统 API 接口文档
    description: 企业级应用项目实战 - 桶装水配送管理后端服务
    version: 1.0.0
    group:
      default:
        group-name: 核心业务接口
        api-rule: package
        api-rule-resources:
          - com.water.delivery.controller
